name: fix-objective-font

on:
  push:
    branches: [ feature/gnomes-v06 ]
    paths:
      - '.github/workflows/fix-objective-font.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gnomes-v06
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply objective font fix
        run: python3 .github/scripts/fix_objective_font.py
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-objective-font.yml .github/scripts/fix_objective_font.py
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m 'Keep objective HUD font stable while pulsing'
          git push origin HEAD:feature/gnomes-v06
