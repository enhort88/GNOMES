name: remove-objective-underline

on:
  push:
    branches: [ feature/gnomes-v06 ]
    paths:
      - '.github/workflows/remove-objective-underline.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gnomes-v06
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove objective underline
        run: python3 .github/scripts/remove_objective_underline.py
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-objective-underline.yml .github/scripts/remove_objective_underline.py
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m 'Remove objective underline overlap'
          git push origin HEAD:feature/gnomes-v06
