name: fix-mobile-issues-v063

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply v0.6.3 fixes
        run: python3 tools/fix_mobile_issues_v063.py
      - name: Static checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java').read_text()
          checks={
            'collapse-neighbour':'collapseApproachCell' in s and 'base*.58f' in s,
            'no-blocked-goal-route':'pathToBlockedGoal(cellFor(w.x,w.y),h.cell)' not in s,
            'stone-background':'0xFF272720' in s,
            'fog-wisps':'0x1B12191B' in s,
            'panel-headroom':'contentT+58f*ui' in s,
            'artifact-safe':'ct+43f*ui' in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('missing: '+','.join(bad))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m "Fix rubble approach, cave backdrop and mobile panel text"
          git push origin HEAD:feature/gnomes-v06
