name: android-assets-check

on:
  push:
    branches: [ feature/gnomes-v06 ]

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify intro assets in Android source dir
        run: |
          test -s assets/intro/story_home.jpg
          test -s assets/intro/story_mine.jpg
          test -s assets/intro/story_enemies.jpg
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Verify packaged APK contains intro assets
        run: |
          unzip -l android/build/outputs/apk/debug/android-debug.apk | grep -E 'assets/intro/story_(home|mine|enemies)\.jpg'
