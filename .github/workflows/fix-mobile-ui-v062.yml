name: fix-mobile-ui-v062

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply mobile UI and fog polish
        run: python3 tools/fix_mobile_ui_v062.py
      - name: Static checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java').read_text()
          checks={
            'soft-fog':'Wispy fringe destroys the square-cell silhouette' in s,
            'short-hud':'levelObjectiveHud()' in s,
            'artifact-short':'ПОКУПАЕТСЯ 1 РАЗ' in s,
            'rune-short':'НА ВСЕХ ГНОМОВ' in s and 'МЕТА • НАВСЕГДА' in s,
            'pill-clip':'d.clipRect(b.l+4f*ui' in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('missing: '+','.join(bad))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m "Fix mobile text overflow and soften cave darkness"
          git push origin HEAD:feature/gnomes-v06
