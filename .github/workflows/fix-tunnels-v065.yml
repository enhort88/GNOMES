name: fix-tunnels-v065

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply tunnel and worker polish
        run: python3 tools/fix_tunnels_v065.py
      - name: Static checks
        run: |
          grep -q 'Direct player orders always win' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'private Vein chooseVein(Worker w,int\[\] loads)' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'private void drawIrregularPuddle' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'private void drawGlowMoss' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'private void softenDeadEnds' core/src/main/java/com/enhort/gnomes/game/CaveMap.java
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java core/src/main/java/com/enhort/gnomes/game/CaveMap.java
          git commit -m 'Polish tunnels, water and mining priorities'
          git push
