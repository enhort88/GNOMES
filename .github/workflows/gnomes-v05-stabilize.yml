name: gnomes-v05-stabilize

on:
  push:
    branches: [ feature/gnomes-v05 ]

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stabilize mechanics
        run: python3 tools/stabilize_v05.py
      - name: Mechanics assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java').read_text()
          m=Path('core/src/main/java/com/enhort/gnomes/game/CaveMap.java').read_text()
          s=Path('core/src/main/java/com/enhort/gnomes/game/GameState.java').read_text()
          checks={
            'dynamic-hazard-reroute':'isDangerCellFor(w,node)' in c,
            'high-tier-trap-awareness':'smart>=4' in c,
            'guardian-tunnel-route':'moveGuardianRouted' in c and 'guardianPath' in c,
            'imp-king-fights':'boolean thief=m.type==EnemyType.IMP' in c,
            'imps-ignore-collapse':'m.type.isImp()?map.pathIgnoringBlocks' in c,
            'ghost-wall-flight':'updateGhost' in c and 'spawnGhostFrom' in c,
            'succubus-charm':'fightAlly' in c and 'm.target.charm' in c,
            'portal-wave':'Portal' in c and 'openPortal' in c,
            'no-enemy-before-five':'state.totalGnomes()>=5&&enemyTimer<=0' in c,
            'priority-collapse-block':'map.isBlocked(node)' in c,
            'global-runes':'runeEffect(RuneType' in s,
            'half-crew':'carriedGnomesCount' in s,
            'danger-goal-rejected':'avoid[goal]' in m,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('failed checks: '+','.join(bad))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Stabilize GNOMES hazards guardian enemies and legacy meta"
          git push origin HEAD:feature/gnomes-v05
