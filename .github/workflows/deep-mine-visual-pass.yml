name: deep-mine-visual-pass

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Normalize visual migration matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/deep_mine_visual_pass.py')
          s=p.read_text()
          old="r'    private void drawGuardian\\(Draw d,float x,float y,float s\\)\\{.*?\\n    \\}\\n\\n    private void drawWorker'"
          new="r'    private void drawGuardian\\(Draw d,float x,float y,float s\\)\\{.*?(?=\\n\\n    private void drawWorker)'"
          if old not in s:
              raise SystemExit('guardian matcher not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply visual pass
        run: python3 tools/deep_mine_visual_pass.py
      - name: Normalize for current Draw API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java')
          s=p.read_text()
          s=s.replace('d.setColor(0xFF3B444A);d.strokeWidth=1f*ui;d.strokeRoundRect(b.l,b.t,b.r,b.b,7f*ui);','d.setColor(0xFF252B30);d.fillRoundRect(b.l+1f*ui,b.t+1f*ui,b.r-1f*ui,b.b-1f*ui,6f*ui);')
          p.write_text(s)
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit visual pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Polish GNOMES hazards characters spawns and performance"
          git push
