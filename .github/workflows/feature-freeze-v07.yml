name: feature-freeze-v07

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  feature-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply gameplay polish
        run: python3 tools/feature_freeze_v07.py
      - name: Generate adaptive music
        run: python3 tools/generate_music_v07.py
      - name: Static checks
        run: |
          grep -q 'enum LevelEvent' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'drawBossHud' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'drawTierUnlock' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'bossSpecial' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'MusicMood' core/src/main/java/com/enhort/gnomes/GameAudio.java
          test -s core/src/main/resources/music/mine_loop_v3.wav
          test -s core/src/main/resources/music/danger_loop.wav
          test -s core/src/main/resources/music/boss_loop.wav
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit feature freeze
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java core/src/main/java/com/enhort/gnomes/game/GameState.java core/src/main/resources/music/*.wav
          git commit -m 'Feature freeze polish: events, bosses, feedback and adaptive music'
          git push
