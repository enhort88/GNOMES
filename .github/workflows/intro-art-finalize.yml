name: intro-art-finalize

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Point intro at generated JPEG art
        run: |
          sed -i 's#intro/story_home.png#intro/story_home.jpg#; s#intro/story_mine.png#intro/story_mine.jpg#; s#intro/story_enemies.png#intro/story_enemies.jpg#; s#story_\*\.png#story_*.jpg#' core/src/main/java/com/enhort/gnomes/intro/IntroScreen.java
      - name: Verify assets
        run: |
          test -s core/src/main/resources/intro/story_home.jpg
          test -s core/src/main/resources/intro/story_mine.jpg
          test -s core/src/main/resources/intro/story_enemies.jpg
          grep -q 'story_home.jpg' core/src/main/java/com/enhort/gnomes/intro/IntroScreen.java
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit final intro
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/java/com/enhort/gnomes/intro/IntroScreen.java
          git commit -m 'Use generated cinematic intro art'
          git push
