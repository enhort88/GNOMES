name: gameplay-control-pass

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Harden migration patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/gameplay_control_pass.py')
          s=p.read_text()
          fixes={
            r"r'    private float moveSpeed\\(Worker w\\)\\{.*?\\n    private Vein chooseVein\\(Worker w\\)\\{.*?\\}'": r"r'    private float moveSpeed\\(Worker w\\)\\{.*?(?=\\n    private void updateMobs)'",
            r"r'    private void robChest\\(Mob m\\)\\{.*?\\n    \\}\\n\\n    private void attackWorker\\(Mob m,Worker w\\)\\{.*?\\n    \\}'": r"r'    private void robChest\\(Mob m\\)\\{.*?(?=\\n    private void killMob)'",
            r"r'    private void fireHazard\\(CaveHazard h\\)\\{.*?\\n    \\}\\n\\n    private void invalidateRoutes'": r"r'    private void fireHazard\\(CaveHazard h\\)\\{.*?\\n    private void invalidateRoutes'",
            r"r'    private void drawHazards\\(Draw d\\)\\{.*?\\n    \\}\\n\\n    private void drawFx'": r"r'    private void drawHazards\\(Draw d\\)\\{.*?\\n    private void drawFx'",
            r"r'    private boolean handleWorldTap\\(float x,float y\\)\\{.*?\\n    \\}\\n\\n    private void buyGlobal'": r"r'    private boolean handleWorldTap\\(float x,float y\\)\\{.*?\\n    private void buyGlobal'",
          }
          for old,new in fixes.items():
              if old not in s:
                  raise SystemExit('migration pattern not found: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Apply gameplay fixes
        run: python3 tools/gameplay_control_pass.py
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit gameplay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core
          git commit -m "Improve command targeting crowd routing hazards and level goals" || exit 0
          git push
