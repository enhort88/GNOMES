name: gameplay-control-pass

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Harden migration patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/gameplay_control_pass.py')
          lines=p.read_text().splitlines()
          rules=[
              ('private float moveSpeed', 'private Vein chooseVein', r"    r'    private float moveSpeed\(Worker w\)\{.*?(?=\n    private void updateMobs)',"),
              ('private void robChest', 'private void attackWorker', r"    r'    private void robChest\(Mob m\)\{.*?(?=\n    private void killMob)',"),
              ('private void fireHazard', 'private void invalidateRoutes', r"    r'    private void fireHazard\(CaveHazard h\)\{.*?\n    private void invalidateRoutes',"),
              ('private void drawHazards', 'private void drawFx', r"    r'    private void drawHazards\(Draw d\)\{.*?\n    private void drawFx',"),
              ('private boolean handleWorldTap', 'private void buyGlobal', r"    r'    private boolean handleWorldTap\(float x,float y\)\{.*?\n    private void buyGlobal',"),
          ]
          found=[False]*len(rules)
          for i,line in enumerate(lines):
              for j,(a,b,newline) in enumerate(rules):
                  if line.lstrip().startswith("r'") and a in line and b in line:
                      lines[i]=newline
                      found[j]=True
          if not all(found):
              raise SystemExit('missing migration rule(s): '+str([i for i,v in enumerate(found) if not v]))
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Apply gameplay fixes
        run: python3 tools/gameplay_control_pass.py
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit gameplay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core
          git commit -m "Improve command targeting crowd routing hazards and level goals" || exit 0
          git push
