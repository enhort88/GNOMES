name: softlock-polish

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply anti-softlock polish
        run: python3 tools/softlock_polish.py
      - name: Verify recovery invariants
        run: |
          grep -q 'objectiveType!=ObjectiveType.CLEAR_VEINS' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'spawnRecoveryVeins(state.depth==1?3:2)' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q '!v.recovery&&state.totalGnomes()>=5' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'state.totalGnomes()==0&&!state.canBuyMiner()' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit polished gameplay
        run: |
          rm -f tools/softlock_polish.py .github/workflows/softlock-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Prevent resource softlocks and polish game over'
          git push
