name: fix-collapse-routing

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fix unreachable enemy routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java')
          s = p.read_text()
          old = '        if(m.path.length==0||m.pathIndex>=m.path.length)return true;\n'
          new = '''        if(m.path.length==0)return false;
                  if(m.pathIndex>=m.path.length){
                      if(m.goalCell<0)return false;
                      float gx=cx(map.col(m.goalCell)),gy=cy(map.row(m.goalCell));
                      return distance(m.x,m.y,gx,gy)<Math.min(cellW,cellH)*.25f;
                  }
          '''
          if old not in s:
              raise SystemExit('followMob pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit routing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m "Respect collapse obstacles in enemy routing" || exit 0
          git push
