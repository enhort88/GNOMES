name: fix-cave-visuals-v064

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply cave polish
        run: |
          python3 tools/fix_cave_visuals_v064.py
          python3 tools/fix_cave_visuals_v064_compile.py
      - name: Static checks
        run: |
          grep -q 'private void applyPit' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'private void settleCollapse' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'private void drawPlantPatch' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'private int floodDirection' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'float sizeJitter=.155f' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -q 'rubblePct' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m 'Polish cave water, plants, rubble and lethal traps'
          git push
