name: gnomes-v05-pass

on:
  push:
    branches: [ feature/gnomes-v05 ]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install fantasy display font
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/RuslanDisplay-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/ruslandisplay/RuslanDisplay-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/RuslanDisplay-OFL.txt \
            https://raw.githubusercontent.com/google/fonts/main/ofl/ruslandisplay/OFL.txt
      - name: Apply GNOMES v0.5 pass
        run: python3 tools/gnomes_v05_pass.py
      - name: Static mechanic assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cave=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java').read_text()
          state=Path('core/src/main/java/com/enhort/gnomes/game/GameState.java').read_text()
          enemy=Path('core/src/main/java/com/enhort/gnomes/game/model/EnemyType.java').read_text()
          checks={
            'hold-buy':'updateBuyHold' in cave,
            'portal':'openPortal' in cave and 'drawPortal' in cave,
            'trap-avoid':'pathAvoiding' in cave,
            'collapse-exploit-guard':'map.isBlocked(node)' in cave,
            'ghost':'GHOST' in enemy and 'spawnGhostFrom' in cave,
            'succubus':'SUCCUBUS' in enemy and 'fightAlly' in cave,
            'half-crew':'carriedGnomesCount' in state and 'retained' in state,
            'enemy-scale':'enemyHpScale' in state and 'enemyDamageScale' in state,
            'global-runes':'runeEffect(RuneType' in state and 'runeActive' in state,
            'artifact-one-buy':'artifactLevels[artifactIndex] > 0' in state,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('missing mechanics: '+','.join(bad))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit generated pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java assets android/src/main/res
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement GNOMES v0.5 progression enemies objectives and polish"
          git push origin HEAD:feature/gnomes-v05
