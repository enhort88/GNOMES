name: gnomes-v05-pass

on:
  push:
    branches: [ feature/gnomes-v05 ]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install fantasy display font
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/RuslanDisplay-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/ruslandisplay/RuslanDisplay-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/RuslanDisplay-OFL.txt \
            https://raw.githubusercontent.com/google/fonts/main/ofl/ruslandisplay/OFL.txt
      - name: Normalize migration matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/gnomes_v05_pass.py')
          s=p.read_text()
          marker='# Mob visual switch + new character art.'
          a=s.index('s = replace_once(s,', s.index(marker))
          b=s.index("new_visuals = r'''", a)
          replacement="""s = sub_once(s, r'    private void drawMob\\(Draw d,Mob m\\)\\{.*?(?=\\n    private void drawImp)', r'''    private void drawMob(Draw d,Mob m){\n        if(m.dead)return;float sz=m.type.size*ui,scale=appearScale(m.spawn,.65f);\n        if(m.spawn>0)drawArrivalRing(d,m.x,m.y,sz*.82f,m.spawn,.65f,m.type.color);\n        if(m.spawn>0){d.save();d.translate(m.x,m.y);d.scale(scale,scale);d.translate(-m.x,-m.y);}\n        switch(m.type){case IMP,IMP_KING->drawImp(d,m,sz);case DEMON,DEMON_KING->drawDemon(d,m,sz);case SUCCUBUS->drawSuccubus(d,m,sz);case GHOST->drawGhost(d,m,sz);default->drawGolem(d,m,sz);}\n        float pct=Math.max(0,m.hp/m.maxHp);if(pct<.999f||m.type.isBoss()){float bw=sz*1.5f;d.setColor(0xCC120E0D);d.fillRoundRect(m.x-bw/2,m.y-sz*.95f,m.x+bw/2,m.y-sz*.84f,2f*ui);d.setColor(0xFFE34F43);d.fillRoundRect(m.x-bw/2,m.y-sz*.95f,m.x-bw/2+bw*pct,m.y-sz*.84f,2f*ui);}\n        if(m.spawn>0)d.restore();\n    }\n''', 'mob visual switch')\n"""
          s=s[:a]+replacement+s[b:]
          bad="mask[map.index(nc,nr)]=true;}}}\n        }return mask;"
          good="mask[map.index(nc,nr)]=true;}}\n        }return mask;"
          if bad not in s:
              raise SystemExit('danger mask brace pattern missing')
          s=s.replace(bad,good,1)
          p.write_text(s)
          PY
      - name: Apply GNOMES v0.5 pass
        run: python3 tools/gnomes_v05_pass.py
      - name: Normalize generated source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cave=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java')
          s=cave.read_text()
          old='private void drawImp(Draw d,Mob m,float s){\n        float hop='
          new='private void drawImp(Draw d,Mob m,float s){\n        float panic=m.flee>0?1f:0f;float hop='
          if old not in s:
              raise SystemExit('drawImp panic anchor missing')
          s=s.replace(old,new,1)
          # Portal spawns must enter the live mob list before updateMobs clears its summon scratch list.
          old='pendingMobs.add(m);portal.spawnTimer=.30f+(type.isBoss()?.22f:0);'
          new='mobs.add(m);portal.spawnTimer=.30f+(type.isBoss()?.22f:0);'
          if old not in s:
              raise SystemExit('portal live-spawn anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('✓ ПРИНАДЛЕЖИТ ВАМ','КУПЛЕН • ПРИНАДЛЕЖИТ ВАМ')
          s=s.replace('✦ АКТИВИРОВАН','АКТИВИРОВАН')
          cave.write_text(s)

          cmap=Path('core/src/main/java/com/enhort/gnomes/game/CaveMap.java')
          m=cmap.read_text()
          start=m.index('public int[] pathAvoiding')
          pos=m.index('if (start == goal) return new int[] { start };',start)
          anchor='if (start == goal) return new int[] { start };'
          replacement=anchor+'\n        if (avoid != null && goal < avoid.length && avoid[goal]) return new int[0];'
          m=m[:pos]+m[pos:].replace(anchor,replacement,1)
          cmap.write_text(m)
          PY
      - name: Static mechanic assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cave=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java').read_text()
          state=Path('core/src/main/java/com/enhort/gnomes/game/GameState.java').read_text()
          enemy=Path('core/src/main/java/com/enhort/gnomes/game/model/EnemyType.java').read_text()
          cmap=Path('core/src/main/java/com/enhort/gnomes/game/CaveMap.java').read_text()
          checks={
            'hold-buy':'updateBuyHold' in cave,
            'portal':'openPortal' in cave and 'drawPortal' in cave and 'mobs.add(m);portal.spawnTimer' in cave,
            'trap-avoid':'pathAvoiding' in cave and 'avoid[goal]' in cmap,
            'collapse-exploit-guard':'map.isBlocked(node)' in cave,
            'ghost':'GHOST' in enemy and 'spawnGhostFrom' in cave,
            'succubus':'SUCCUBUS' in enemy and 'fightAlly' in cave,
            'half-crew':'carriedGnomesCount' in state and 'retained' in state,
            'enemy-scale':'enemyHpScale' in state and 'enemyDamageScale' in state,
            'global-runes':'runeEffect(RuneType' in state and 'runeActive' in state,
            'artifact-one-buy':'artifactLevels[artifactIndex] > 0' in state,
            'imp-flee':'panic=m.flee' in cave and 'm.flee=.95f' in cave,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('missing mechanics: '+','.join(bad))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit generated pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java assets android/src/main/res
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement GNOMES v0.5 progression enemies objectives and polish"
          git push origin HEAD:feature/gnomes-v05
