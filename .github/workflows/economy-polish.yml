name: economy-polish

on:
  push:
    branches: [ feature/gnomes-v06 ]
    paths: [ '.github/workflows/economy-polish.yml' ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gnomes-v06
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply economy and gameplay polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def repl(s, old, new, name):
              if old not in s:
                  raise SystemExit(f'patch target not found: {name}')
              return s.replace(old, new, 1)

          # --- Economy: stone -> gnomes, silver -> upgrades, gold -> artifacts, diamonds -> runes.
          gp = Path('core/src/main/java/com/enhort/gnomes/game/GameState.java')
          g = gp.read_text()

          g = repl(g, '''    public long guardianCost() {
        if (FREE_SHOP) return 0;
        return Math.round(900d * Math.pow(2.05, guardianLevel));
    }

    public boolean buyOrUpgradeGuardian() {
        long cost = guardianCost();
        if (!FREE_SHOP) {
            if (guardianLevel < 3) {
                if (stone < cost) return false;
                stone -= cost;
                levelInvestedValue += cost;
            } else {
                long silverCost = Math.max(40, cost / 95);
                if (silver < silverCost) return false;
                silver -= silverCost;
                levelInvestedValue += silverCost * 8L;
            }
        }
        guardianLevel++;
        return true;
    }

    public String guardianCostLabel() {
        if (FREE_SHOP) return "БЕСПЛАТНО";
        long cost = guardianCost();
        if (guardianLevel < 3) return cost + " кам";
        return Math.max(40, cost / 95) + " Ag";
    }''', '''    public long guardianCost() {
        if (FREE_SHOP) return 0;
        return Math.round(24d * Math.pow(1.85, guardianLevel));
    }

    public boolean buyOrUpgradeGuardian() {
        long cost = guardianCost();
        if (!FREE_SHOP) {
            if (silver < cost) return false;
            silver -= cost;
            levelInvestedValue += cost * 8L;
        }
        guardianLevel++;
        return true;
    }

    public String guardianCostLabel() {
        return FREE_SHOP ? "БЕСПЛАТНО" : guardianCost() + " Ag";
    }''', 'guardian economy')

          g = repl(g, '''    public boolean upgradeTier(int tier) {
        if (tier < 0 || tier >= tierLevels.length) return false;
        long cost = tierUpgradeCost(tier);
        if (!FREE_SHOP) {
            if (tier < 2) {
                if (stone < cost) return false;
                stone -= cost;
                levelInvestedValue += cost;
            } else if (tier < 4) {
                long paid = Math.max(1, cost / 90);
                if (silver < paid) return false;
                silver -= paid;
                levelInvestedValue += paid * 8L;
            } else {
                long paid = Math.max(1, cost / 180);
                if (gold < paid) return false;
                gold -= paid;
                levelInvestedValue += paid * 20L;
            }
        }
        tierLevels[tier]++;
        return true;
    }''', '''    public boolean upgradeTier(int tier) {
        if (tier < 0 || tier >= tierLevels.length) return false;
        long cost = tierUpgradeCost(tier);
        if (!FREE_SHOP) {
            if (stone < cost) return false;
            stone -= cost;
            levelInvestedValue += cost;
        }
        tierLevels[tier]++;
        return true;
    }''', 'tier upgrades use stone')

          g = repl(g, '''    public long globalUpgradeCost(int kind) {
        if (FREE_SHOP) return 0;
        int lvl = kind == 0 ? miningUpgrade : kind == 1 ? speedUpgrade : combatUpgrade;
        return Math.round((220 + kind * 150L) * Math.pow(1.82, lvl));
    }

    public boolean buyGlobalUpgrade(int kind) {
        if (FREE_SHOP) {
            if (kind == 0) miningUpgrade++;
            else if (kind == 1) speedUpgrade++;
            else combatUpgrade++;
            return true;
        }
        long cost = globalUpgradeCost(kind);
        if (kind == 0) {
            if (stone < cost) return false;
            stone -= cost; levelInvestedValue += cost; miningUpgrade++; return true;
        }
        if (kind == 1) {
            long paid = Math.max(3, cost / 90);
            if (silver < paid) return false;
            silver -= paid; levelInvestedValue += paid * 8L; speedUpgrade++; return true;
        }
        long paid = Math.max(2, cost / 150);
        if (gold < paid) return false;
        gold -= paid; levelInvestedValue += paid * 20L; combatUpgrade++; return true;
    }''', '''    public long globalUpgradeCost(int kind) {
        if (FREE_SHOP) return 0;
        int lvl = kind == 0 ? miningUpgrade : kind == 1 ? speedUpgrade : combatUpgrade;
        return Math.round((18 + kind * 7L) * Math.pow(1.65, lvl));
    }

    public boolean buyGlobalUpgrade(int kind) {
        if (kind < 0 || kind > 2) return false;
        if (FREE_SHOP) {
            if (kind == 0) miningUpgrade++;
            else if (kind == 1) speedUpgrade++;
            else combatUpgrade++;
            return true;
        }
        long cost = globalUpgradeCost(kind);
        if (silver < cost) return false;
        silver -= cost;
        levelInvestedValue += cost * 8L;
        if (kind == 0) miningUpgrade++;
        else if (kind == 1) speedUpgrade++;
        else combatUpgrade++;
        return true;
    }''', 'global upgrades use silver')

          g = repl(g, '''    public int artifactCost(int artifactIndex) {
        if (FREE_SHOP) return 0;
        int[] costs = {18, 32, 48, 70};
        return costs[Math.max(0, Math.min(costs.length - 1, artifactIndex))];
    }''', '''    public int artifactCost(int artifactIndex) {
        if (FREE_SHOP) return 0;
        int[] costs = {8, 14, 22, 34};
        return costs[Math.max(0, Math.min(costs.length - 1, artifactIndex))];
    }''', 'artifact costs')

          g = repl(g, '''        if (!FREE_SHOP) {
            if (diamond < cost) return false;
            diamond -= cost;
        }
        artifactLevels[artifactIndex] = 1;''', '''        if (!FREE_SHOP) {
            if (gold < cost) return false;
            gold -= cost;
            levelInvestedValue += cost * 20L;
        }
        artifactLevels[artifactIndex] = 1;''', 'artifacts use gold')

          g = repl(g, '''        levelEarnedValue += materialValue(material, whole);
        return whole;
    }

    private static float upgradeCurve''', '''        levelEarnedValue += materialValue(material, whole);
        return whole;
    }

    /** Direct find from a dead-end cache. It is already in the settlement, so chest multipliers do not apply. */
    public long grantBonus(RockType.Material material, long amount) {
        long whole = Math.max(0L, amount);
        switch (material) {
            case STONE -> stone += whole;
            case SILVER -> silver += whole;
            case GOLD -> gold += whole;
            case DIAMOND -> diamond += whole;
        }
        levelEarnedValue += materialValue(material, whole);
        return whole;
    }

    private static float upgradeCurve''', 'bonus grant')

          gp.write_text(g)

          # --- Cave/UI polish.
          cp = Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java')
          s = cp.read_text()

          s = repl(s, '''    private static final class Notice {
        final String text; final int color; final float maxLife; float life;
        Notice(String text,int color,float life){this.text=text;this.color=color;this.life=this.maxLife=life;}
    }

    private static final class CaveHazard''', '''    private static final class Notice {
        final String text; final int color; final float maxLife; float life;
        Notice(String text,int color,float life){this.text=text;this.color=color;this.life=this.maxLife=life;}
    }

    private static final class BonusCache {
        final int cell; final RockType.Material material; final long amount; final float x,y;
        boolean taken; float pulse;
        BonusCache(int cell,RockType.Material material,long amount,float x,float y){this.cell=cell;this.material=material;this.amount=amount;this.x=x;this.y=y;}
    }

    private static final class CaveHazard''', 'bonus class')

          s = repl(s, '''    private final List<Notice> notices=new ArrayList<>();
    private Portal portal;''', '''    private final List<Notice> notices=new ArrayList<>();
    private final List<BonusCache> bonuses=new ArrayList<>();
    private Portal portal;''', 'bonus list')

          s = repl(s, '''        mobs.clear();pendingMobs.clear();hazards.clear();fx.clear();veins.clear();portal=null;clearPriority(false);''', '''        mobs.clear();pendingMobs.clear();hazards.clear();fx.clear();veins.clear();bonuses.clear();portal=null;clearPriority(false);''', 'clear bonuses')
          s = repl(s, '''        buildVeins();
        syncWorkers(true);''', '''        buildVeins();
        buildBonuses();
        syncWorkers(true);''', 'build bonuses')

          marker = '''    private RockType chooseRockType(int salt){'''
          if marker not in s:
              raise SystemExit('patch target not found: bonus method insertion')
          bonus_methods = '''    private void buildBonuses(){
        List<Integer> ends=map.deadEnds();
        java.util.Collections.shuffle(ends,random);
        int home=map.index(map.startCol,map.startRow),limit=Math.min(3,1+state.depth/8),made=0;
        for(int cell:ends){
            if(made>=limit)break;
            if(cell==home||hasLivingVeinAt(cell))continue;
            // Not every dead end pays out. Finding one should still feel like a small discovery.
            if(random.nextFloat()>.34f)continue;
            RockType.Material material=chooseBonusMaterial();
            long amount=bonusAmount(material);
            float x=cx(map.col(cell)),y=cy(map.row(cell));
            bonuses.add(new BonusCache(cell,material,amount,x,y));made++;
        }
    }
    private boolean hasLivingVeinAt(int cell){for(Vein v:veins)if(!v.dead&&v.cell==cell)return true;return false;}
    private RockType.Material chooseBonusMaterial(){
        float q=random.nextFloat();
        if(state.depth>=9&&q<.07f)return RockType.Material.DIAMOND;
        if(state.depth>=5&&q<.34f)return RockType.Material.GOLD;
        if(state.depth>=2&&q<.72f)return RockType.Material.SILVER;
        return RockType.Material.STONE;
    }
    private long bonusAmount(RockType.Material material){return switch(material){
        case STONE -> 70L+state.depth*22L+random.nextInt(70);
        case SILVER -> 5L+state.depth*2L+random.nextInt(8);
        case GOLD -> 2L+state.depth/2L+random.nextInt(5);
        case DIAMOND -> 1L+state.depth/12L;
    };}
    private String bonusLabel(BonusCache b){return switch(b.material){case STONE->"● "+b.amount;case SILVER->"Ag "+b.amount;case GOLD->"Au "+b.amount;case DIAMOND->"◆ "+b.amount;};}
    private int bonusColor(BonusCache b){return switch(b.material){case STONE->0xFFB7BDC2;case SILVER->0xFFE2EAF0;case GOLD->0xFFFFD35A;case DIAMOND->0xFF67D7F2;};}
    private void updateBonuses(float dt){
        for(BonusCache b:bonuses){
            if(b.taken)continue;b.pulse+=dt;
            for(Worker w:workers){
                if(distance(w.x,w.y,b.x,b.y)>Math.min(cellW,cellH)*.24f)continue;
                b.taken=true;state.grantBonus(b.material,b.amount);spawnSparks(b.x,b.y,bonusColor(b),8);game.audio.play(GameAudio.Sfx.COIN,.76f);game.audio.vibrate(24);
                toast="ТАЙНИК • +"+bonusLabel(b);toastTime=1.7f;addNotice("НАЙДЕН ТАЙНИК • +"+bonusLabel(b),bonusColor(b),2.4f);
                if(priorityKind==PriorityKind.POINT&&priorityCell==b.cell){clearPriority(false);resetWorkerRoutes();}
                break;
            }
        }
    }
    private void drawBonuses(Draw d){
        for(BonusCache b:bonuses){if(b.taken)continue;float p=.5f+.5f*(float)Math.sin(elapsed*3.8f+b.cell),sz=Math.min(cellW,cellH)*.18f;
            d.setColor(alpha(bonusColor(b),.10f+.08f*p));d.fillCircle(b.x,b.y,sz*1.75f);
            d.setColor(0xFF5A351E);d.fillRoundRect(b.x-sz*.62f,b.y-sz*.30f,b.x+sz*.62f,b.y+sz*.42f,sz*.15f);
            d.setColor(0xFF8A572D);d.fillRoundRect(b.x-sz*.58f,b.y-sz*.46f,b.x+sz*.58f,b.y-sz*.08f,sz*.18f);
            d.setColor(0xFFFFC85A);d.fillRect(b.x-sz*.09f,b.y-sz*.16f,b.x+sz*.09f,b.y+sz*.18f);
            d.setColor(bonusColor(b));for(int i=0;i<3;i++){float a=elapsed*1.7f+i*2.094f;d.fillCircle(b.x+(float)Math.cos(a)*sz*.86f,b.y+(float)Math.sin(a)*sz*.66f,(1.2f+p)*ui);}
        }}

'''
          s = s.replace(marker, bonus_methods + marker, 1)

          s = repl(s, '''        updateVeins(dt);updatePortal(dt);updateGuardian(dt);updateMobs(dt);updateHazards(dt);updateWorkers(dt*workerTimeScale);updateFx(dt);updateObjective();updateResourceRecovery(dt);''', '''        updateVeins(dt);updatePortal(dt);updateGuardian(dt);updateMobs(dt);updateHazards(dt);updateWorkers(dt*workerTimeScale);updateBonuses(dt);updateFx(dt);updateObjective();updateResourceRecovery(dt);''', 'update bonuses')

          s = repl(s, '''        d.setColor(0xFF0B0A09);d.fillRect(worldL,worldT,worldR,worldB);drawRockMass(d);drawTunnels(d);drawWetCorridors(d);drawCaveDecor(d);drawHazards(d);drawVeins(d);drawChest(d);drawPortal(d);''', '''        d.setColor(0xFF0B0A09);d.fillRect(worldL,worldT,worldR,worldB);drawRockMass(d);drawTunnels(d);drawWetCorridors(d);drawCaveDecor(d);drawHazards(d);drawVeins(d);drawBonuses(d);drawChest(d);drawPortal(d);''', 'draw bonuses')

          s = repl(s, '''        Vein best=null;float bd=Float.MAX_VALUE;
        for(Vein v:veins){if(v.dead)continue;float q=dist2(x,y,v.x,v.y);if(q<bd){bd=q;best=v;}}''', '''        BonusCache bonus=null;float bonusD=Float.MAX_VALUE;
        for(BonusCache b:bonuses){if(b.taken)continue;float q=dist2(x,y,b.x,b.y);if(q<bonusD){bonusD=q;bonus=b;}}
        float bonusRadius=Math.min(cellW,cellH)*.62f;
        if(bonus!=null&&bonusD<=bonusRadius*bonusRadius){
            longPressEligible=false;priorityKind=PriorityKind.POINT;priorityVein=null;priorityMob=null;priorityHazard=null;priorityCell=bonus.cell;priorityX=bonus.x;priorityY=bonus.y;resetWorkerRoutes();
            toast="ПРИКАЗ • ЗАБРАТЬ ТАЙНИК";toastTime=1.35f;game.audio.play(GameAudio.Sfx.UI,.72f);game.audio.vibrate(16);return true;
        }

        Vein best=null;float bd=Float.MAX_VALUE;
        for(Vein v:veins){if(v.dead)continue;float q=dist2(x,y,v.x,v.y);if(q<bd){bd=q;best=v;}}''', 'tap bonuses')

          s = repl(s, '''        if(levelEvent!=LevelEvent.NONE){d.textSize=4.1f*ui;d.setColor(levelEventColor());d.text(levelEventTitle(),width*.66f,57f*ui);}
        d.align=Draw.Align.LEFT;
        float y=65f*ui,section=width/4f;''', '''        if(levelEvent!=LevelEvent.NONE){d.textSize=3.7f*ui;d.setColor(levelEventColor());d.text(levelEventTitle(),width*.66f,52f*ui);}
        d.align=Draw.Align.LEFT;
        float y=69f*ui,section=width/4f;''', 'hud event overlap')

          s = repl(s, '''        switch(tab){case GNOMES->drawGnomePanel(d);case UPGRADES->drawUpgradePanel(d);case ARTIFACTS->drawArtifactPanel(d);case RUNES->drawRunePanel(d);}
        button(d,speed,speedHeld?"ГНОМЫ РАБОТАЮТ ×4":"УСКОРИТЬ ГНОМОВ ×4",true,.86f);
    }''', '''        switch(tab){case GNOMES->drawGnomePanel(d);case UPGRADES->drawUpgradePanel(d);case ARTIFACTS->drawArtifactPanel(d);case RUNES->drawRunePanel(d);}
        if(speedHeld)drawSpeedGlow(d);
        button(d,speed,speedHeld?"УСКОРЕНИЕ":"УСКОРИТЬ ГНОМОВ",true,.86f);
    }
    private void drawSpeedGlow(Draw d){
        float pulse=.5f+.5f*(float)Math.sin(elapsed*11f);
        for(int i=3;i>=1;i--){float pad=(3f+i*3.5f+pulse*2f)*ui;d.setColor(alpha(0xFFFFD45C,.045f+i*.025f));d.fillRoundRect(speed.l-pad,speed.t-pad,speed.r+pad,speed.b+pad,(12f+i*3f)*ui);}
        d.setColor(alpha(0xFFFFE88A,.65f+.25f*pulse));
        for(int i=0;i<10;i++){float q=(elapsed*(.28f+i*.013f)+i*.103f)%1f,x=speed.l+(speed.r-speed.l)*q,y=(i&1)==0?speed.t-3f*ui:speed.b+3f*ui;d.fillCircle(x,y,(1.4f+(i%3)*.45f)*ui);}
    }''', 'speed glow')

          s = repl(s, '''        if(selectedTier==0)button(d,primary,"КУПИТЬ • "+format(state.minerBuyCost()),true,.72f);else statPill(d,primary,"УР. "+state.tierLevels[selectedTier]+" • БОЙ "+one.format(gt.combatPower*state.combatMultiplier(selectedTier)));button(d,secondary,"УЛУЧШИТЬ • "+format(state.tierUpgradeCost(selectedTier)),true,.66f);''', '''        if(selectedTier==0)button(d,primary,"КУПИТЬ • ● "+format(state.minerBuyCost()),true,.72f);else statPill(d,primary,"УР. "+state.tierLevels[selectedTier]+" • БОЙ "+one.format(gt.combatPower*state.combatMultiplier(selectedTier)));button(d,secondary,"УЛУЧШИТЬ • ● "+format(state.tierUpgradeCost(selectedTier)),true,.66f);''', 'gnome stone labels')

          s = repl(s, '''    private void drawUpgradePanel(Draw d){float ct=contentTop();d.align=Draw.Align.CENTER;d.bold=true;d.textSize=7.0f*ui;d.setColor(0xFFF0F3F5);d.text("ШАХТА И ИНФРАСТРУКТУРА",width/2,ct+17f*ui);d.bold=false;d.align=Draw.Align.LEFT;button(d,primary,"КИРКИ ур."+state.miningUpgrade,true,.70f);button(d,secondary,"ЛОГИСТИКА ур."+state.speedUpgrade,true,.66f);button(d,tertiary,"БОЙ ур."+state.combatUpgrade,true,.70f);button(d,quaternary,state.guardianLevel==0?"НАНЯТЬ СТРАЖА":"СТРАЖ ур."+state.guardianLevel,true,.66f);}''', '''    private void drawUpgradePanel(Draw d){float ct=contentTop();d.align=Draw.Align.CENTER;d.bold=true;d.textSize=7.0f*ui;d.setColor(0xFFF0F3F5);d.text("ШАХТА И ИНФРАСТРУКТУРА • СЕРЕБРО",width/2,ct+17f*ui);d.bold=false;d.align=Draw.Align.LEFT;button(d,primary,"КИРКИ ур."+state.miningUpgrade+" • Ag "+state.globalUpgradeCost(0),true,.62f);button(d,secondary,"ЛОГИСТИКА ур."+state.speedUpgrade+" • Ag "+state.globalUpgradeCost(1),true,.58f);button(d,tertiary,"БОЙ ур."+state.combatUpgrade+" • Ag "+state.globalUpgradeCost(2),true,.62f);button(d,quaternary,(state.guardianLevel==0?"НАНЯТЬ СТРАЖА":"СТРАЖ ур."+state.guardianLevel)+" • "+state.guardianCostLabel(),true,.56f);}''', 'upgrade silver labels')

          s = repl(s, '''button(d,primary,owned?(active?"СНЯТЬ":"НАДЕТЬ"):"КУПИТЬ • ◆"+state.artifactCost(selectedArtifact),true,.62f);statPill(d,secondary,"ПОКУПАЕТСЯ 1 РАЗ");statPill(d,tertiary,owned?"КУПЛЕН":"НУЖНЫ ◆ АЛМАЗЫ");''', '''button(d,primary,owned?(active?"СНЯТЬ":"НАДЕТЬ"):"КУПИТЬ • Au "+state.artifactCost(selectedArtifact),true,.62f);statPill(d,secondary,"ПОКУПАЕТСЯ 1 РАЗ");statPill(d,tertiary,owned?"КУПЛЕН":"НУЖНО ЗОЛОТО");''', 'artifact gold labels')

          s = repl(s, '''else if(state.buyArtifact(selectedArtifact))toast="АРТЕФАКТ КУПЛЕН";else toast="НЕ ХВАТАЕТ АЛМАЗОВ";''', '''else if(state.buyArtifact(selectedArtifact))toast="АРТЕФАКТ КУПЛЕН";else toast="НЕ ХВАТАЕТ ЗОЛОТА";''', 'artifact gold toast')

          s = repl(s, '''    private void buyGlobal(int kind){if(state.buyGlobalUpgrade(kind)){toast="УЛУЧШЕНИЕ КУПЛЕНО";}else toast="НЕ ХВАТАЕТ РЕСУРСОВ";toastTime=1.2f;}''', '''    private void buyGlobal(int kind){if(state.buyGlobalUpgrade(kind)){toast="УЛУЧШЕНИЕ КУПЛЕНО";}else toast="НЕ ХВАТАЕТ СЕРЕБРА";toastTime=1.2f;}''', 'upgrade silver toast')

          cp.write_text(s)
          PY

      - name: Verify economy rules
        run: |
          grep -F 'if (silver < cost) return false;' core/src/main/java/com/enhort/gnomes/game/GameState.java
          grep -F 'if (gold < cost) return false;' core/src/main/java/com/enhort/gnomes/game/GameState.java
          grep -F 'НУЖНО ЗОЛОТО' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -F 'УСКОРИТЬ ГНОМОВ' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -F 'НАЙДЕН ТАЙНИК' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java

      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Commit polish and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/economy-polish.yml
          git add core/src/main/java/com/enhort/gnomes/game/GameState.java core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m 'Polish economy, dead-end rewards and speed feedback'
          git push origin HEAD:feature/gnomes-v06
