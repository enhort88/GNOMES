name: economy-polish

on:
  push:
    branches: [ feature/gnomes-v06 ]
    paths:
      - '.github/workflows/economy-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gnomes-v06
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply polish
        run: python3 .github/scripts/economy_polish.py
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/economy-polish.yml .github/scripts/economy_polish.py
          git add core/src/main/java/com/enhort/gnomes/game/GameState.java core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m 'Polish economy, dead-end rewards and speed feedback'
          git push origin HEAD:feature/gnomes-v06
