name: settings-layout-fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Widen volume value gap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/src/main/java/com/enhort/gnomes/menu/MenuScreen.java')
          s=p.read_text()
          old='''        volumeDown.set(rowR-104f*ui,infoCard.t+100f*ui,rowR-58f*ui,infoCard.t+134f*ui);\n        volumeUp.set(rowR-46f*ui,infoCard.t+100f*ui,rowR,infoCard.t+134f*ui);'''
          new='''        volumeDown.set(rowR-142f*ui,infoCard.t+100f*ui,rowR-100f*ui,infoCard.t+134f*ui);\n        volumeUp.set(rowR-42f*ui,infoCard.t+100f*ui,rowR,infoCard.t+134f*ui);'''
          if old not in s: raise SystemExit('settings volume layout pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/enhort/gnomes/menu/MenuScreen.java
          git commit -m "Give settings volume controls safe spacing" || exit 0
          git push
