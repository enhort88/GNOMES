name: fix-depth-skip

on:
  push:
    branches: [ feature/gnomes-v06 ]
    paths: [ '.github/workflows/fix-depth-skip.yml' ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gnomes-v06
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Fix post-tutorial objective selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java')
          s = p.read_text()
          old = '        if(state.depth==1)objectiveType=ObjectiveType.ASCEND_GNOME;else if(state.depth%10==0)objectiveType=ObjectiveType.BOSS_HUNT;else objectiveType=ObjectiveType.values()[Math.floorMod(state.depth+slot*3,5)];objectiveStartKills=state.enemiesDefeated;objectiveTarget=0;objectiveTreasureTarget=0;objectiveStarted=false;'
          new = '''        if(state.depth==1){
            objectiveType=ObjectiveType.ASCEND_GNOME;
        }else if(state.depth%10==0){
            objectiveType=ObjectiveType.BOSS_HUNT;
        }else{
            // ASCEND_GNOME is the depth-1 tutorial objective only. A Veteran is carried between depths,
            // so selecting it again could make a fresh level complete instantly and appear to skip a depth.
            ObjectiveType[] pool={ObjectiveType.CLEAR_VEINS,ObjectiveType.GUARDIAN,ObjectiveType.DEMON_PURGE,ObjectiveType.BOSS_HUNT,ObjectiveType.TREASURE};
            objectiveType=pool[Math.floorMod(state.depth+slot*3,pool.length)];
        }
        objectiveStartKills=state.enemiesDefeated;objectiveTarget=0;objectiveTreasureTarget=0;objectiveStarted=false;'''
          if old not in s:
              raise SystemExit('setupObjective selector not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify objective invariants
        run: |
          grep -F 'ASCEND_GNOME is the depth-1 tutorial objective only' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          grep -F 'ObjectiveType.TREASURE' core/src/main/java/com/enhort/gnomes/game/CaveScreen.java

      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-depth-skip.yml
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m 'Prevent instant depth skip after tutorial'
          git push origin HEAD:feature/gnomes-v06
