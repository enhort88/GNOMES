name: fix-summary-v061

on:
  push:
    branches: [ feature/gnomes-v06 ]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fix victory summary layout
        run: python3 tools/fix_summary_v061.py
      - name: Check summary layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/enhort/gnomes/game/CaveScreen.java').read_text()
          checks={
            'responsive-card':'height*.91f' in s,
            'short-note':'1 новый шахтёр + часть старого отряда' in s,
            'button-inside':'summaryOk.set(l+18f*ui,b-48f*ui' in s,
            'smaller-summary-text':'d.textSize=16f*ui' in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('missing: '+','.join(bad))
          PY
      - name: Compile core
        run: ./gradlew -PskipAndroid :core:compileJava --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/enhort/gnomes/game/CaveScreen.java
          git commit -m "Fix victory summary layout for enlarged text"
          git push origin HEAD:feature/gnomes-v06
